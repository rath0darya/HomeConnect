plugins {
    id "com.android.application"
}

android {
    namespace "com.rath0darya.homeconnect"
    compileSdk 35

    defaultConfig {
        applicationId "com.rath0darya.homeconnect"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.12.1"
}

tasks.register("prepareHomeConnectAssets", Copy) {
    from(rootProject.projectDir.parentFile) {
        include "index.html"
        include "style.css"
        include "app.js"
        include "config.js"
    }
    into(layout.projectDirectory.dir("src/main/assets"))
}

preBuild.dependsOn(prepareHomeConnectAssets)
