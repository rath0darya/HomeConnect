name: Build HomeConnect APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "download/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        id: build
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace --info 2>&1 | tee ../apk-build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Copy APK to repository download folder
        if: success()
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/release/app-release.apk download/HomeConnect.apk
          sha256sum download/HomeConnect.apk > download/HomeConnect.apk.sha256

      - name: Save build log
        if: always()
        run: |
          mkdir -p diagnostics
          cp apk-build.log diagnostics/apk-build.log || true

      - name: Commit build output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/HomeConnect.apk download/HomeConnect.apk.sha256 diagnostics/apk-build.log
          git diff --cached --quiet && exit 0
          git commit -m "Build HomeConnect Android APK"
          git push
