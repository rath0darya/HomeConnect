name: Build HomeConnect APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"

      - name: Prepare web assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp index.html style.css app.js config.js android/app/src/main/assets/

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Put APK in download
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/release/app-release.apk download/HomeConnect.apk
          sha256sum download/HomeConnect.apk > download/HomeConnect.apk.sha256

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/HomeConnect.apk download/HomeConnect.apk.sha256
          git diff --cached --quiet || git commit -m "Build HomeConnect APK"
          git push
